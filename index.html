<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ganzflicker Study</title>
    <script src="https://unpkg.com/jspsych@7.3.1"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-button-response@1.1.2"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.2"></script>
    <script src="https://unpkg.com/@jspsych/plugin-image-button-response@1.1.2"></script>
    <script src="https://unpkg.com/@jspsych/plugin-preload@1.1.2"></script>
    <link href="https://unpkg.com/jspsych@7.3.1/css/jspsych.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="jspsych-target"></div>

    <script>
        let metadata;
        let participantId;

        // Function to load JSON data from a file
        async function loadJSON(file) {
            const response = await fetch(file);
            return await response.json();
        }

        // Function to load CSV data and parse it
        async function loadCSV(file) {
            const response = await fetch(file);
            const csvText = await response.text();
            return parseCSV(csvText);
        }
        function parseCSV(csvText) {
            const rows = [];
            let inQuotes = false;
            let currentField = '';
            let currentRow = [];
            let i = 0;

            const pushField = () => {
                currentRow.push(currentField);
                currentField = '';
            };

            while (i < csvText.length) {
                const char = csvText[i];
                const nextChar = csvText[i + 1];

                if (char === '"') {
                if (inQuotes && nextChar === '"') {
                    // Escaped quote
                    currentField += '"';
                    i++;
                } else {
                    inQuotes = !inQuotes;
                }
                } else if (char === ',' && !inQuotes) {
                pushField();
                } else if ((char === '\n' || char === '\r') && !inQuotes) {
                if (char === '\r' && nextChar === '\n') i++; // Handle \r\n
                pushField();
                if (currentRow.length > 1 || rows.length === 0) {
                    rows.push(currentRow);
                }
                currentRow = [];
                } else {
                currentField += char;
                }
                i++;
            }

            // Push last field and row if needed
            if (currentField.length > 0 || currentRow.length > 0) {
                pushField();
                rows.push(currentRow);
            }

            const headers = rows[0];
            const data = rows.slice(1).map(row => {
                const obj = {};
                headers.forEach((header, idx) => {
                obj[header] = row[idx] ?? ''; // Handle missing fields
                });
                return obj;
            });

            return data;
            }

        // Function to get available ids from a folder using the pre-generated JSON
        async function getAvailableIds(folderPrefix) {
            try {
                // Load the pre-generated available_ids.json file
                const availableIds = await loadJSON('available_ids.json');

                if (folderPrefix === 'aphantasia') {
                    return availableIds.aphantasia_ids;
                } else if (folderPrefix === 'phantasia') {
                    return availableIds.phantasia_ids;
                } else {
                    console.error(`Unknown folder prefix: ${folderPrefix}`);
                    return [];
                }
            } catch (error) {
                console.error(`Error getting IDs for ${folderPrefix}:`, error);
                return [];
            }
        }

        async function initializeMetadata() {
            try {
                const configData = await loadJSON('config.json');
                availableModels = configData.available_models || [];
                const hallucinationsData = await loadCSV('hallucinations.csv');
                const aphantasiaImages = configData.image_paths?.aphantasia_images || {};
                const phantasiaImages = configData.image_paths?.phantasia_images || {};
                const aphantasiaIds = configData.aphantasia_ids || Object.keys(aphantasiaImages).map(Number);
                const phantasiaIds = configData.phantasia_ids || Object.keys(phantasiaImages).map(Number);

                metadata = {
                    "available_models": availableModels,
                    "hallucinations_data": hallucinationsData,
                    "aphantasia_images": aphantasiaImages,
                    "phantasia_images": phantasiaImages,
                    "aphantasia_ids": aphantasiaIds,
                    "phantasia_ids": phantasiaIds
                };

                console.log("Metadata initialized:", metadata);
                await startExperiment();

            } catch (error) {
                console.error("Error loading metadata:", error);
                document.querySelector('#jspsych-target').innerHTML = '<p style="color: red;">Error loading study data. Please refresh the page or contact the researcher.</p>';
            }
        }

        // Initialize jsPsych
        const jsPsych = initJsPsych({
            on_finish: function(data) {
                // The data saving is now handled in the completionTrial's on_load function
                console.log('Study completed!');
                // console.log('Final data:', JSON.stringify(jsPsych.data.get().values()));
            }
        });

        // Study parameters
        let currentParticipant = {
            results: {},
            description: "" // Added placeholder for participant description
        };
        let aphantasiaParticipant;
        let phantasiaParticipant;
        let selectedImages = {};
        let finalSelectedModel = null;

        // Function to get random item from an array
        function getRandomItem(array) {
            return array[Math.floor(Math.random() * array.length)];
        }

        // Function to shuffle an array
        function shuffleArray(array) {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        }

        // Function to find participant data by ID
        function findParticipantById(id) {
            return metadata.hallucinations_data.find(p => p.id === id.toString());
        }

        // Function to initialize study data for a new participant
        function initializeStudyData() {
            // Select one random aphantasia ID
            const aphantasiaId = getRandomItem(metadata.aphantasia_ids);
            aphantasiaParticipant = findParticipantById(aphantasiaId);

            // If not found, create a fallback
            if (!aphantasiaParticipant) {
                aphantasiaParticipant = {
                    id: aphantasiaId,
                    "Please describe as much as you can remember about what you saw in the Ganzflicker:":
                    "Participant data not found. This is a fallback description for aphantasia participant."
                };
            }

            // Select one random phantasia ID
            const phantasiaId = getRandomItem(metadata.phantasia_ids);
            phantasiaParticipant = findParticipantById(phantasiaId);

            // If not found, create a fallback
            if (!phantasiaParticipant) {
                phantasiaParticipant = {
                    id: phantasiaId,
                    "Please describe as much as you can remember about what you saw in the Ganzflicker:":
                    "Participant data not found. This is a fallback description for phantasia participant."
                };
            }

            // Initialize results structure for the current participant
            currentParticipant.results = {
                subject_id: participantId,
                aphantasia_id: aphantasiaId,
                phantasia_id: phantasiaId,
                aphantasia_description: aphantasiaParticipant["Please describe as much as you can remember about what you saw in the Ganzflicker:"],
                phantasia_description: phantasiaParticipant["Please describe as much as you can remember about what you saw in the Ganzflicker:"],
                user_choices: {}
            };

            console.log("Study initialized for participant:", participantId);
            console.log("Aphantasia ID:", aphantasiaId, "Description:", currentParticipant.results.aphantasia_description);
            console.log("Phantasia ID:", phantasiaId, "Description:", currentParticipant.results.phantasia_description);
        }

        // Function to get image path
        function getImagePath(descriptionType, model) {
            if (!aphantasiaParticipant || !phantasiaParticipant || !metadata) {
                console.error("Data not yet initialized!");
                return "placeholder.jpeg";
            }

            if (descriptionType === "participant") {
                return `participant_data/participant_${participantId}/participant_${participantId}_${model}.jpeg`;
            } else if (descriptionType === "aphantasia" && metadata.aphantasia_images[aphantasiaParticipant.id] && metadata.aphantasia_images[aphantasiaParticipant.id][model]) {
                return metadata.aphantasia_images[aphantasiaParticipant.id][model];
            } else if (descriptionType === "phantasia" && metadata.phantasia_images[phantasiaParticipant.id] && metadata.phantasia_images[phantasiaParticipant.id][model]) {
                return metadata.phantasia_images[phantasiaParticipant.id][model];
            }

            console.warn(`Could not find image path for ${descriptionType}, ID: ${aphantasiaParticipant?.id || phantasiaParticipant?.id}, Model: ${model}`);
            return "placeholder.jpeg"; // Fallback
        }

        // Updated preload section to directly use the determined image paths
        const preloadTrial = {
            type: jsPsychPreload,
            images: function() {
                const imagesToPreload = [];
                if (aphantasiaParticipant && phantasiaParticipant && metadata && metadata.available_models) {
                    metadata.available_models.forEach(model => {
                        imagesToPreload.push(getImagePath("participant", model));
                        imagesToPreload.push(getImagePath("aphantasia", model));
                        imagesToPreload.push(getImagePath("phantasia", model));
                    });
                }
                return imagesToPreload;
            },
            auto_preload: true,
            message: "Loading study images...",
            show_progress_bar: true,
            on_load: function() {
                console.log("Images preloaded successfully!");
            },
            on_error: function(file) {
                console.error(`Error preloading image: ${file}`);
            }
        };


        // Create participant ID input screen
        const participantIdTrial = {
            type: jsPsychHtmlKeyboardResponse,
            stimulus: `
                <h1>Please enter your Participant ID:</h1>
                <input type="text" id="participant-id-input">
                <button id="start-button">Start Study</button>
            `,
            choices: 'NO_KEYS',
            on_load: function() {
                document.querySelector('#start-button').addEventListener('click', function() {
                    const inputElement = document.querySelector('#participant-id-input');
                    if (inputElement && inputElement.value.trim() !== '') {
                        participantId = inputElement.value.trim();
                        jsPsych.finishTrial();
                    } else {
                        alert('Please enter a valid Participant ID.');
                    }
                });
            }
        };

        // Create welcome screen
        const welcomeTrial = {
            type: jsPsychHtmlButtonResponse,
            stimulus: function() {
                return `
                    <h1>Welcome to the Ganzflicker Study</h1>
                    <p class="instruction-text">
                        Your Participant ID is: <b>${participantId}</b>
                        <br><br>
                        In this study, you will be shown sets of images generated by different AI models based on various descriptions.
                        <br><br>
                        For each set, please select the image that best represents what you perceived during the ganzflicker experience.
                        <br><br>
                        At the end, you will make a final selection from your previous choices.
                    </p>
                `;
            },
            choices: ["Begin Study"],
            on_finish: function() {
                // Initialize the study data after participant ID is entered and welcome screen is confirmed
                initializeStudyData();
            }
        };

        // Create image trial for each model
        function createModelImageTrial(model, modelIndex) {
            return {
                type: jsPsychHtmlKeyboardResponse,
                stimulus: function() {
                    const imageOptions = [
                {
                    type: "aphantasia",
                    path: getImagePath("aphantasia", model),
                    desc: currentParticipant.results.aphantasia_description
                },
                {
                    type: "phantasia",
                    path: getImagePath("phantasia", model),
                    desc: currentParticipant.results.phantasia_description
                },
                {
                    type: "participant",
                    path: getImagePath("participant", model),
                    desc: currentParticipant.description
                }
                ];

                    // Shuffle the options
                    const shuffledOptions = shuffleArray(imageOptions);

                    // Store the positions for data recording
                    jsPsych.data.addProperties({
                        [`${model}_image_positions`]: shuffledOptions.map(o => o.type)
                    });

                    return `
                        <h2>Images Generated by ${model.toUpperCase()}</h2>
                        <p class="instruction-text">Click on the image that best represents what you perceived during the ganzflicker experience.</p>
                        <div class="image-container">
                            ${shuffledOptions.map((option, index) => `
                                <div class="image-option" data-type="${option.type}" data-position="${index}" data-index="${modelIndex}">
                                    <img src="${option.path}" alt="Image option ${index + 1}">
                                    <div class="image-caption">Option ${index + 1}</div>
                                </div>
                            `).join('')}
                        </div>
                    `;
                },
                choices: [],
                trial_duration: null,
                on_load: function() {
                    const startTime = performance.now();

                    // Add click event to images that advances to the next trial
                    document.querySelectorAll('.image-option').forEach(element => {
                        element.addEventListener('click', function() {
                            const selectedType = this.getAttribute('data-type');
                            const position = parseInt(this.getAttribute('data-position'));

                            let choiceCategory;
                            if (selectedType === "aphantasia") {
                                choiceCategory = "aphantasia_description";
                            } else if (selectedType === "phantasia") {
                                choiceCategory = "phantasia_description";
                            } else {
                                choiceCategory = "own_description";
                            }

                            // Calculate reaction time
                            const reactionTime = (performance.now() - startTime) / 1000;

                            // Store the selection
                            selectedImages[model] = {
                                path: this.querySelector('img').src,
                                type: selectedType,
                                choice: choiceCategory,
                                image_choice_location: position,
                                reaction_time: reactionTime.toFixed(2) // Convert to seconds
                            };

                            // Record the user's choice in currentParticipant.results
                            currentParticipant.results.user_choices[model] = {
                                choice: choiceCategory,
                                reaction_time: parseFloat(reactionTime.toFixed(2)),
                                image_choice_location: position === 0 ? "left" :
                                                   (position === 1 ? "middle" : "right")
                            };

                            // End the trial to move to the next
                            jsPsych.finishTrial({
                                selected_image: selectedImages[model],
                                rt: reactionTime
                            });
                        });
                    });
                }
            };
        }

        // Create final selection trial
        const finalSelectionTrial = {
            type: jsPsychHtmlKeyboardResponse,
            stimulus: function() {
                return `
                    <h2>Final Selection</h2>
                    <p class="instruction-text">
                        Now, please select the image that best represents what you perceived during the ganzflicker experience.
                    </p>
                    <div class="final-selection-container">
                        ${metadata.available_models.map(model => `
                            <div class="final-option" data-model="${model}">
                                <div class="model-label">${model.toUpperCase()}</div>
                                <img src="${selectedImages[model].path}" alt="${model} selected image">
                            </div>
                        `).join('')}
                    </div>
                `;
            },
            choices: [],
            trial_duration: null,
            on_load: function() {
                const startTime = performance.now();

                // Add click event to final options that completes this trial
                document.querySelectorAll('.final-option').forEach(element => {
                    element.addEventListener('click', function() {
                        const selectedModel = this.getAttribute('data-model');
                    // Calculate reaction time
                    const reactionTime = (performance.now() - startTime) / 1000;

                    // Store the final selection
                    finalSelectedModel = {
                        model: selectedModel,
                        reaction_time: reactionTime.toFixed(2),
                        description: selectedImages[selectedModel].choice
                    };

                    // Record the final choice in currentParticipant.results
                    currentParticipant.results.user_choices.final_choice = {
                        model: selectedModel,
                        reaction_time: parseFloat(reactionTime.toFixed(2)),
                        description: selectedImages[selectedModel].choice
                    };

                    // End the trial to move to completion
                    jsPsych.finishTrial({
                        final_selected_model: finalSelectedModel,
                        rt: reactionTime
                    });
                });
            });
        }
    };

        // Create completion screen
        const completionTrial = {
            type: jsPsychHtmlButtonResponse, // Keep it as button response for now
            stimulus: `
                <h2>Study Completed</h2>
                <p class="instruction-text">
                    Thank you for participating in this study!
                </p>
            `,
            choices: [], // Remove the "Close" button initially
            on_load: function() {
                const participantData = {
                    subject_id: participantId,
                    results: currentParticipant.results
                };

                // Send data to the local server
                fetch('http://localhost:3000/save-participant-data', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(participantData),
                })
                .then(response => response.text())
                .then(message => {
                    console.log(message); // Log server response
                    document.querySelector('#jspsych-target').innerHTML = `
                        <h2>Study Completed</h2>
                        <p class="instruction-text">
                            Thank you for participating in this study! Your data has been successfully saved. You may now close this window.
                        </p>
                    `;
                })
                .catch(error => {
                    console.error('Error saving data:', error);
                    document.querySelector('#jspsych-target').innerHTML = `
                        <h2 style="color: red;">Error</h2>
                        <p class="instruction-text" style="color: red;">
                            There was an error saving your data. Please try again or contact the researcher.
                        </p>
                    `;
                });

                console.log('Attempting to save data on completion screen load.');
            }
        };

        // Start the experiment
        async function startExperiment() { // ADD 'async' here
            const timeline = [
                participantIdTrial,
                welcomeTrial,
                preloadTrial // Ensure preload trial is after welcome so participant data is initialized
            ];

            metadata.available_models.forEach((model, index) => {
                timeline.push(createModelImageTrial(model, index));
            });

            timeline.push(finalSelectionTrial, completionTrial);

            jsPsych.run(timeline);
        }

        // Load metadata and then start the experiment
        initializeMetadata();
    </script>
</body>
</html>
