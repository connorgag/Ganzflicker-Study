<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ganzflicker Study</title>
    <script src="https://unpkg.com/jspsych@7.3.1"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-button-response@1.1.2"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.2"></script>
    <script src="https://unpkg.com/@jspsych/plugin-image-button-response@1.1.2"></script>
    <script src="https://unpkg.com/@jspsych/plugin-preload@1.1.2"></script>
    <script src="https://unpkg.com/@jspsych/plugin-fullscreen@1.1.2"></script>
    <link href="https://unpkg.com/jspsych@7.3.1/css/jspsych.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="style.css">
    <style>
        /* Added styles for the next button */
        .next-button {
            display: none;
            margin: 20px auto;
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .next-button:hover {
            background-color: #45a049;
        }
        .selected-image {
            border: 3px solid #4CAF50;
            box-shadow: 0 0 10px rgba(76, 175, 80, 0.7);
        }
        .error {
            color: red;
        }
    </style>
</head>
<body>
    <div id="jspsych-target"></div>

    <script>
        let metadata;
        function getCurrentDateTime() {
            return new Date().toISOString();
        }

        // Function to load JSON data from a file
        async function loadJSON(file) {
            const response = await fetch(file);
            return await response.json();
        }

        // Function to load CSV data and parse it
        async function loadCSV(file) {
            const response = await fetch(file);
            const csvText = await response.text();
            return parseCSV(csvText);
        }
        function parseCSV(csvText) {
            const rows = [];
            let inQuotes = false;
            let currentField = '';
            let currentRow = [];
            let i = 0;

            const pushField = () => {
                currentRow.push(currentField);
                currentField = '';
            };

            while (i < csvText.length) {
                const char = csvText[i];
                const nextChar = csvText[i + 1];

                if (char === '"') {
                if (inQuotes && nextChar === '"') {
                    // Escaped quote
                    currentField += '"';
                    i++;
                } else {
                    inQuotes = !inQuotes;
                }
                } else if (char === ',' && !inQuotes) {
                pushField();
                } else if ((char === '\n' || char === '\r') && !inQuotes) {
                if (char === '\r' && nextChar === '\n') i++; // Handle \r\n
                pushField();
                if (currentRow.length > 1 || rows.length === 0) {
                    rows.push(currentRow);
                }
                currentRow = [];
                } else {
                currentField += char;
                }
                i++;
            }

            // Push last field and row if needed
            if (currentField.length > 0 || currentRow.length > 0) {
                pushField();
                rows.push(currentRow);
            }

            const headers = rows[0];
            const data = rows.slice(1).map(row => {
                const obj = {};
                headers.forEach((header, idx) => {
                obj[header] = row[idx] ?? ''; // Handle missing fields
                });
                return obj;
            });

            return data;
        }

        // Function to get available ids from a folder using the pre-generated JSON
        async function getAvailableIds(folderPrefix) {
            try {
                // Load the pre-generated available_ids.json file
                const availableIds = await loadJSON('available_ids.json');

                if (folderPrefix === 'aphantasia') {
                    return availableIds.aphantasia_ids;
                } else if (folderPrefix === 'phantasia') {
                    return availableIds.phantasia_ids;
                } else {
                    console.error(`Unknown folder prefix: ${folderPrefix}`);
                    return [];
                }
            } catch (error) {
                console.error(`Error getting IDs for ${folderPrefix}:`, error);
                return [];
            }
        }

        async function initializeMetadata() {
            try {
                const configData = await loadJSON('config.json');
                availableModels = configData.available_models || [];
                const hallucinationsData = await loadCSV('hallucinations.csv');
                const aphantasiaImages = configData.image_paths?.aphantasia_images || {};
                const phantasiaImages = configData.image_paths?.phantasia_images || {};
                const aphantasiaIds = configData.aphantasia_ids || Object.keys(aphantasiaImages).map(Number);
                const phantasiaIds = configData.phantasia_ids || Object.keys(phantasiaImages).map(Number);

                metadata = {
                    "available_models": availableModels,
                    "hallucinations_data": hallucinationsData,
                    "aphantasia_images": aphantasiaImages,
                    "phantasia_images": phantasiaImages,
                    "aphantasia_ids": aphantasiaIds,
                    "phantasia_ids": phantasiaIds
                };

                console.log("Metadata initialized:", metadata);
                await startExperiment();

            } catch (error) {
                console.error("Error loading metadata:", error);
                document.querySelector('#jspsych-target').innerHTML = '<p style="color: red;">Error loading study data. Please refresh the page or contact the researcher.</p>';
            }
        }

        // Initialize jsPsych
        const jsPsych = initJsPsych({
            on_finish: function(data) {
                // The data saving is now handled in the completionTrial's on_load function
                console.log('Study completed!');
                // console.log('Final data:', JSON.stringify(jsPsych.data.get().values()));
            }
        });

        // Study parameters
        let currentParticipant = {
            results: {},
            description: "" // Added placeholder for participant description
        };
        let aphantasiaParticipant;
        let phantasiaParticipant;
        let selectedImages = {};
        let finalSelectedModel = null;

        // Function to get random item from an array
        function getRandomItem(array) {
            return array[Math.floor(Math.random() * array.length)];
        }

        // Function to shuffle an array
        function shuffleArray(array) {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        }

        // Function to find participant data by ID
        function findParticipantById(id) {
            return metadata.hallucinations_data.find(p => p.id === id.toString());
        }

        // Function to initialize study data for a new participant
        function initializeStudyData() {
            // Select one random aphantasia ID
            const aphantasiaId = getRandomItem(metadata.aphantasia_ids);
            aphantasiaParticipant = findParticipantById(aphantasiaId);

            // If not found, create a fallback
            if (!aphantasiaParticipant) {
                aphantasiaParticipant = {
                    id: aphantasiaId,
                    "Please describe as much as you can remember about what you saw in the Ganzflicker:":
                    "Participant data not found. This is a fallback description for aphantasia participant."
                };
            }

            // Select one random phantasia ID
            const phantasiaId = getRandomItem(metadata.phantasia_ids);
            phantasiaParticipant = findParticipantById(phantasiaId);

            // If not found, create a fallback
            if (!phantasiaParticipant) {
                phantasiaParticipant = {
                    id: phantasiaId,
                    "Please describe as much as you can remember about what you saw in the Ganzflicker:":
                    "Participant data not found. This is a fallback description for phantasia participant."
                };
            }

            // Initialize results structure for the current participant
            currentParticipant.results = {
                subject_id: participantId,
                aphantasia_id: aphantasiaId,
                phantasia_id: phantasiaId,
                aphantasia_description: aphantasiaParticipant["Please describe as much as you can remember about what you saw in the Ganzflicker:"],
                phantasia_description: phantasiaParticipant["Please describe as much as you can remember about what you saw in the Ganzflicker:"],
                trials: [], // New array to store all trial results in the new format
                user_choices: {} // Keep the old format for compatibility
            };

            console.log("Study initialized for participant:", participantId);
            console.log("Aphantasia ID:", aphantasiaId, "Description:", currentParticipant.results.aphantasia_description);
            console.log("Phantasia ID:", phantasiaId, "Description:", currentParticipant.results.phantasia_description);
        }

        // Function to get image base name without extension 
        function getImageBaseName(descriptionType, model) {
            if (descriptionType === "participant") {
                return `${participantId}_${model}`;
            } else if (descriptionType === "aphantasia") {
                return `${aphantasiaParticipant.id}_${model}`;
            } else if (descriptionType === "phantasia") {
                return `${phantasiaParticipant.id}_${model}`;
            }
            return "placeholder";
        }

        // Function to get image path for display
        function getImagePath(descriptionType, model) {
            if (!aphantasiaParticipant || !phantasiaParticipant || !metadata) {
                console.error("Data not yet initialized!");
                return "placeholder.jpeg";
            }

            if (descriptionType === "participant") {
                return `participant_data/participant_${participantId}/participant_${participantId}_${model}.jpeg`;
            } else if (descriptionType === "aphantasia" && metadata.aphantasia_images[aphantasiaParticipant.id] && metadata.aphantasia_images[aphantasiaParticipant.id][model]) {
                return metadata.aphantasia_images[aphantasiaParticipant.id][model];
            } else if (descriptionType === "phantasia" && metadata.phantasia_images[phantasiaParticipant.id] && metadata.phantasia_images[phantasiaParticipant.id][model]) {
                return metadata.phantasia_images[phantasiaParticipant.id][model];
            }

            console.warn(`Could not find image path for ${descriptionType}, ID: ${aphantasiaParticipant?.id || phantasiaParticipant?.id}, Model: ${model}`);
            return "placeholder.jpeg"; // Fallback
        }

        // Updated preload section to directly use the determined image paths
        const preloadTrial = {
            type: jsPsychPreload,
            images: function() {
                const imagesToPreload = [];
                if (aphantasiaParticipant && phantasiaParticipant && metadata && metadata.available_models) {
                    metadata.available_models.forEach(model => {
                        imagesToPreload.push(getImagePath("participant", model));
                        imagesToPreload.push(getImagePath("aphantasia", model));
                        imagesToPreload.push(getImagePath("phantasia", model));
                    });
                }
                return imagesToPreload;
            },
            auto_preload: true,
            message: "Loading study images...",
            show_progress_bar: true,
            on_load: function() {
                console.log("Images preloaded successfully!");
            },
            on_error: function(file) {
                console.error(`Error preloading image: ${file}`);
            }
        };

        // Create participant ID input screen
        const participantIdTrial = {
            type: jsPsychHtmlKeyboardResponse,
            stimulus: `
                <h1>Please enter your Participant ID:</h1>
                <input type="text" id="participant-id-input">
                <button id="start-button">Start Study</button>
            `,
            choices: 'NO_KEYS',
            on_load: function() {
                document.querySelector('#start-button').addEventListener('click', function() {
                    const inputElement = document.querySelector('#participant-id-input');
                    if (inputElement && inputElement.value.trim() !== '') {
                        participantId = inputElement.value.trim();
                        jsPsych.finishTrial();
                    } else {
                        alert('Please enter a valid Participant ID.');
                    }
                });
            }
        };

        // Create welcome screen with fullscreen functionality
        const welcomeTrial = {
            type: jsPsychHtmlButtonResponse,
            stimulus: function() {
                return `
                    <h1>Welcome to the Ganzflicker Study</h1>
                    <p class="instruction-text">
                        Your Participant ID is: <b>${participantId}</b>
                        <br><br>
                        In this study, you will be shown sets of images generated by different AI models based on various descriptions.
                        <br><br>
                        For each set, please select the image that best represents what you perceived during the ganzflicker experience.
                        <br><br>
                        At the end, you will make a final selection from your previous choices.
                        <br><br>
                        <b>The study will switch to fullscreen mode when you click "Begin Study".</b>
                    </p>
                `;
            },
            choices: ["Begin Study"],
            on_load: function() {
                // Add event listener to the button to enter fullscreen before finishing the trial
                document.querySelector('.jspsych-btn').addEventListener('click', function(e) {
                    // Prevent default button behavior temporarily
                    e.preventDefault();
                    e.stopPropagation();
                    
                    // Request fullscreen
                    const element = document.documentElement;
                    if (element.requestFullscreen) {
                        element.requestFullscreen();
                    } else if (element.mozRequestFullScreen) {
                        element.mozRequestFullScreen();
                    } else if (element.webkitRequestFullscreen) {
                        element.webkitRequestFullscreen();
                    } else if (element.msRequestFullscreen) {
                        element.msRequestFullscreen();
                    }
                    
                    // Continue with the trial after a short delay to allow fullscreen to engage
                    setTimeout(() => {
                        // Initialize the study data and continue
                        initializeStudyData();
                        
                        // Now finish the trial
                        const clickEvent = new MouseEvent('click', {
                            bubbles: true,
                            cancelable: true,
                            view: window
                        });
                        
                        // We need to simulate a new click after the fullscreen request
                        document.querySelector('.jspsych-btn').dispatchEvent(clickEvent);
                    }, 500);
                }, { once: true }); // Use once: true to prevent multiple handlers
            },
            on_finish: function() {
                console.log("Welcome trial completed, study data initialized");
            }
        };

        // Create exit fullscreen trial for the end of the experiment
        const exitFullscreenTrial = {
            type: jsPsychFullscreen,
            fullscreen_mode: false,
            delay_after: 0
        };

        // Create image trial for each model with updated data format
        function createModelImageTrial(model, modelIndex) {
            return {
                type: jsPsychHtmlKeyboardResponse,
                stimulus: function() {
                    const imageOptions = [
                        {
                            type: "aphantasia",
                            path: getImagePath("aphantasia", model),
                            desc: currentParticipant.results.aphantasia_description
                        },
                        {
                            type: "phantasia",
                            path: getImagePath("phantasia", model),
                            desc: currentParticipant.results.phantasia_description
                        },
                        {
                            type: "participant",
                            path: getImagePath("participant", model),
                            desc: currentParticipant.description
                        }
                    ];

                    // Shuffle the options
                    const shuffledOptions = shuffleArray(imageOptions);

                    // Store the positions for data recording
                    jsPsych.data.addProperties({
                        [`${model}_image_positions`]: shuffledOptions.map(o => o.type)
                    });

                    return `
                        <h2>Images Generated by ${model.toUpperCase()}</h2>
                        <p class="instruction-text">Click on the image that best represents what you perceived during the ganzflicker experience.</p>
                        <div class="image-container">
                            ${shuffledOptions.map((option, index) => `
                                <div class="image-option" data-type="${option.type}" data-position="${index}" data-index="${modelIndex}">
                                    <img src="${option.path}" alt="Image option ${index + 1}">
                                </div>
                            `).join('')}
                        </div>
                        <button class="next-button" id="next-button">Next</button>
                    `;
                },
                choices: [],
                trial_duration: null,
                on_load: function() {
                    // Start timing as soon as the trial loads
                    const startTime = performance.now();
                    let selectedElement = null;
                    
                    // Get the next button element
                    const nextButton = document.getElementById('next-button');

                    // Add click event to images
                    document.querySelectorAll('.image-option').forEach(element => {
                        element.addEventListener('click', function() {
                            // First, remove selection class from all images
                            document.querySelectorAll('.image-option').forEach(el => {
                                el.querySelector('img').classList.remove('selected-image');
                            });
                            
                            // Add selection class to clicked image
                            this.querySelector('img').classList.add('selected-image');
                            
                            // Record the selection
                            selectedElement = this;
                            
                            // Show the next button
                            nextButton.style.display = 'block';
                        });
                    });
                    
                    // Add click event for the next button to advance to the next trial
                    nextButton.addEventListener('click', function() {
                        if (selectedElement) {
                            // Record the time when the next button is clicked
                            const endTime = performance.now();
                            
                            const selectedType = selectedElement.getAttribute('data-type');
                            const position = parseInt(selectedElement.getAttribute('data-position'));
                            const imagePath = selectedElement.querySelector('img').src;
                            
                            // Extract the image filename without extension
                            const fullFilename = imagePath.split('/').pop();
                            const imageBaseName = fullFilename.split('.')[0]; // Remove the extension

                            // Convert position to location name
                            const locationNames = ["left", "middle", "right"];
                            const locationName = locationNames[position];

                            // Convert to new choice format
                            let choiceName;
                            if (selectedType === "aphantasia") {
                                choiceName = "aphantasia";
                            } else if (selectedType === "phantasia") {
                                choiceName = "phantasia";
                            } else {
                                choiceName = "own";
                            }

                            // Calculate if the choice is accurate (they chose their own description)
                            const accuracy = selectedType === "participant" ? 1 : 0;

                            // Calculate reaction time from trial load to Next button click
                            const reactionTime = (endTime - startTime) / 1000;

                            // Get current date and time
                            const datetime = getCurrentDateTime();

                            // Create the new format result entry
                            const resultEntry = {
                                subject_id: participantId,
                                trial_type: "normal",
                                model: model,
                                aphantasia_image: getImageBaseName("aphantasia", model),
                                phantasia_image: getImageBaseName("phantasia", model),
                                target: getImageBaseName("participant", model),
                                choice: choiceName,
                                reaction_time: parseFloat(reactionTime.toFixed(2)),
                                image_choice_location: locationName,
                                accuracy: accuracy,
                                chosen_model: "na",
                                chosen_image: imageBaseName,  // Add the chosen image filename without extension
                                datetime: datetime // Add the date and time
                            };

                            // Store the result entry in new format
                            if (!currentParticipant.results.trials) {
                                currentParticipant.results.trials = [];
                            }
                            currentParticipant.results.trials.push(resultEntry);

                            // Also store the selection in the old format for compatibility
                            let choiceCategory;
                            if (selectedType === "aphantasia") {
                                choiceCategory = "aphantasia_description";
                            } else if (selectedType === "phantasia") {
                                choiceCategory = "phantasia_description";
                            } else {
                                choiceCategory = "own_description";
                            }
                            
                            selectedImages[model] = {
                                path: selectedElement.querySelector('img').src,
                                type: selectedType,
                                choice: choiceName,
                                image_choice_location: locationName,
                                reaction_time: reactionTime.toFixed(2),
                                imageBaseName: imageBaseName, // Store the image base name
                                datetime: datetime // Add the date and time
                            };

                            // Also record for old format compatibility
                            currentParticipant.results.user_choices[model] = {
                                choice: choiceCategory,
                                reaction_time: parseFloat(reactionTime.toFixed(2)),
                                image_choice_location: locationName,
                                chosen_image: imageBaseName, // Add the chosen image base name
                                datetime: datetime // Add the date and time
                            };

                            // End the trial to move to the next
                            jsPsych.finishTrial({
                                selected_image: selectedImages[model],
                                rt: reactionTime,
                                datetime: datetime
                            });
                        }
                    });
                }
            };
        }

        // Update the final selection trial to use the new data format
        const finalSelectionTrial = {
            type: jsPsychHtmlKeyboardResponse,
            stimulus: function() {
                // Calculate grid positions for each model
                const positions = {};
                metadata.available_models.forEach((model, index) => {
                    const row = Math.floor(index / 3);
                    const col = index % 3;
                    positions[model] = row === 0 
                        ? (col === 0 ? 'top_left' : (col === 1 ? 'top_middle' : 'top_right'))
                        : (col === 0 ? 'bottom_left' : (col === 1 ? 'bottom_middle' : 'bottom_right'));
                });
                
                return `
                    <h2>Final Selection</h2>
                    <p class="instruction-text">
                        Now, please select the image that best represents what you perceived during the ganzflicker experience.
                    </p>
                    <div class="final-selection-container">
                        ${metadata.available_models.map((model, index) => `
                            <div class="final-option" data-model="${model}" data-position="${positions[model]}">
                                <div class="model-label">${model.toUpperCase()}</div>
                                <img src="${selectedImages[model].path}" alt="${model} selected image">
                            </div>
                        `).join('')}
                    </div>
                    <button class="next-button" id="final-next-button">Complete Study</button>
                `;
            },
            choices: [],
            trial_duration: null,
            on_load: function() {
                // Start timing as soon as the final selection screen loads
                const startTime = performance.now();
                let selectedElement = null;
                
                // Get the next button element
                const nextButton = document.getElementById('final-next-button');
                nextButton.style.display = 'none';

                // Add click event to final options
                document.querySelectorAll('.final-option').forEach(element => {
                    element.addEventListener('click', function() {
                        // First, remove selection class from all images
                        document.querySelectorAll('.final-option img').forEach(img => {
                            img.classList.remove('selected-image');
                        });
                        
                        // Add selection class to clicked image
                        this.querySelector('img').classList.add('selected-image');
                        
                        // Record the selection
                        selectedElement = this;
                        
                        // Show the next button
                        nextButton.style.display = 'block';
                    });
                });
                
                // Add click event for the next button to complete the study
                nextButton.addEventListener('click', function() {
                    if (selectedElement) {
                        // Record the time when the Complete Study button is clicked
                        const endTime = performance.now();
                        
                        const selectedModel = selectedElement.getAttribute('data-model');
                        const position = selectedElement.getAttribute('data-position');
                        const imagePath = selectedElement.querySelector('img').src;
                        
                        // Extract the image filename without extension
                        const fullFilename = imagePath.split('/').pop();
                        const imageBaseName = fullFilename.split('.')[0]; // Remove the extension
                        
                        // Calculate reaction time from trial load to Complete Study button click
                        const reactionTime = (endTime - startTime) / 1000;

                        // Get current date and time
                        const datetime = getCurrentDateTime();

                        // Get the choice type from the previous selection
                        const choiceType = selectedImages[selectedModel].choice;
                        
                        // Calculate if the choice is accurate (they chose their own description)
                        const accuracy = choiceType === "own" ? 1 : 0;

                        // Create the final selection entry in the new format
                        const finalResultEntry = {
                            subject_id: participantId,
                            trial_type: "final",
                            model: "na",
                            aphantasia_image: "na",
                            phantasia_image: "na",
                            target: "na",
                            choice: choiceType,
                            reaction_time: parseFloat(reactionTime.toFixed(2)),
                            image_choice_location: position,
                            accuracy: accuracy,
                            chosen_model: selectedModel,
                            chosen_image: imageBaseName, // Add the chosen image filename without extension
                            datetime: datetime // Add the date and time
                        };

                        // Add to the trials array
                        currentParticipant.results.trials.push(finalResultEntry);
                        
                        // Store in old format for compatibility
                        let descriptionType;
                        if (choiceType === "aphantasia") {
                            descriptionType = "aphantasia_description";
                        } else if (choiceType === "phantasia") {
                            descriptionType = "phantasia_description";
                        } else {
                            descriptionType = "own_description";
                        }

                        // Store the final selection in old format
                        finalSelectedModel = {
                            model: selectedModel,
                            reaction_time: reactionTime.toFixed(2),
                            description: descriptionType,
                            chosen_image: imageBaseName, // Add the chosen image filename without extension
                            datetime: datetime // Add the date and time
                        };

                        // Store in old format for compatibility
                        currentParticipant.results.user_choices.final_choice = {
                            model: selectedModel,
                            reaction_time: parseFloat(reactionTime.toFixed(2)),
                            description: descriptionType,
                            chosen_image: imageBaseName, // Add the chosen image filename without extension
                            datetime: datetime // Add the date and time
                        };

                        // End the trial to move to completion
                        jsPsych.finishTrial({
                            final_selected_model: finalSelectedModel,
                            rt: reactionTime,
                            datetime: datetime
                        });
                    }
                });
            }
        };

        const completionTrial = {
            type: jsPsychHtmlButtonResponse,
            stimulus: `
                <h2>Study Completed</h2>
                <p class="instruction-text">
                    Thank you for participating in this study!
                </p>
                <p class="download-status">Your data is being saved...</p>
                <div class="button-container">
                    <button class="start-over-button" onclick="window.location.href='${window.location.href}'">Start Over</button>
                    <button id="manual-download-button" class="start-over-button" style="display: none;">Download Data</button>
                </div>
            `,
            choices: [], // No default button choices
            on_load: function() {
                const display = jsPsych.getDisplayElement();
                const statusElement = display.querySelector('.download-status');
                const downloadButton = document.getElementById('manual-download-button');

                fetch('http://localhost:3000/save-participant-data', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        subject_id: participantId, 
                        trials: currentParticipant.results.trials
                    }),
                })
                .then(response => response.text())
                .then(message => {
                    // Update the status message
                    statusElement.textContent = 'Your data has been saved.';
                })
                .catch(error => {
                    // Show error message
                    statusElement.textContent = 'There was an error saving your data. Please use the button below to download your data.';
                    statusElement.style.color = 'red';
                    statusElement.style.fontSize = '26px'; // Corrected font size
                    console.error('Error saving data:', error);

                    // Show the manual download button
                    downloadButton.style.display = 'inline-block';

                    // Add click event to download the data manually
                    downloadButton.addEventListener('click', function() {
                        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({
                            subject_id: participantId,
                            trials: currentParticipant.results.trials
                        }, null, 2));
                        const downloadAnchor = document.createElement('a');
                        downloadAnchor.setAttribute('href', dataStr);
                        downloadAnchor.setAttribute('download', `participant_${participantId}_data.json`);
                        document.body.appendChild(downloadAnchor);
                        downloadAnchor.click();
                        document.body.removeChild(downloadAnchor);
                    });
                });
            }
        };

        // Start the experiment
        async function startExperiment() {
            const timeline = [
                participantIdTrial,
                welcomeTrial, // This will now handle fullscreen entry
                preloadTrial
            ];

            // Create a copy of the available models and shuffle it
            const shuffledModels = shuffleArray([...metadata.available_models]);
            
            // Store the randomized order for data analysis
            jsPsych.data.addProperties({
                'model_presentation_order': shuffledModels
            });
            
            // Add the model trials in the shuffled order
            shuffledModels.forEach((model, index) => {
                timeline.push(createModelImageTrial(model, index));
            });

            timeline.push(
                finalSelectionTrial, 
                exitFullscreenTrial, // Exit fullscreen before showing completion
                completionTrial
            );

            jsPsych.run(timeline);
        }

        // Load metadata and then start the experiment
        initializeMetadata();
    </script>
</body>
</html>
