// Helper function to convert a single object to CSV
function objectToCSV(obj) {
  // Get all keys as columns
  const columns = Object.keys(obj);
  
  // Create header row
  const headerRow = columns.join(',');
  
  // Create data row
  const dataRow = columns.map(col => {
    let value = obj[col];
    
    // Handle undefined/null values
    if (value === undefined || value === null) {
      return "NA";
    }
    
    // Convert to string if not already
    if (typeof value !== 'string') {
      value = String(value);
    }
    
    // Handle special characters for CSV
    value = value.replace(/"/g, '""'); // Escape quotes
    value = value.replace(/\n/g, ' '); // Replace newlines with spaces
    
    // Wrap in quotes if contains comma or quote
    if (value.includes(',') || value.includes('"') || value.includes('\n')) {
      value = `"${value}"`;
    }
    
    return value;
  }).join(',');
  
  // Combine header and data
  return headerRow + '\n' + dataRow;
}

// Keep the original JSON download function for backup/debugging
function downloadObjectAsJson(exportObj, exportName) {
  const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(exportObj);
  const downloadAnchorNode = document.createElement('a');
  downloadAnchorNode.setAttribute("href", dataStr);
  downloadAnchorNode.setAttribute("download", exportName + ".json");
  document.body.appendChild(downloadAnchorNode);
  downloadAnchorNode.click();
  downloadAnchorNode.remove();
}

// Helper function to download CSV
function downloadCSV(csv, filename) {
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement("a");
  
  // Create a download link
  const url = URL.createObjectURL(blob);
  link.setAttribute("href", url);
  link.setAttribute("download", filename + ".csv");
  
  // Append to body, click, and remove
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

    // This ensures the randomization happens when the code runs, not during timeline execution
    const shuffledTrials = jsPsych.randomization.shuffle(visualExperienceTrials);
    
    // Now add the shuffled trials to the timeline

    const firstRandomizedTrial = {
      timeline: [shuffledTrials[0]],
      conditional_function: function() {
        return sawVisuals;
      }
    };

    // Then add the second randomized trial (the other one)

                <div class="question-container">

                  <div class="option"><input type="radio" name="duration_auditory" value="Brief moment" required> Brief moment</div>
                  <div class="option"><input type="radio" name="duration_auditory" value="1-2 seconds"> 1-2 seconds</div>

            `;
            return html;
          },
          choices: ['Continue'],
          on_load: function() {
            // Add validation before continuing
            document.querySelector('.jspsych-btn').addEventListener('click', function(e) {
              const form = document.getElementById('auditory-details-form');
              const errorMsg = document.getElementById('auditory-form-error');
              
              // Check if all required questions are answered
              const questions = [
                'frequency_auditory',
                'intensity_auditory',
                'duration_auditory',
                'time_to_emerge_auditory'
              ];
              
              let hasError = false;
              
              // Reset previous errors
              document.querySelectorAll('.highlight-error').forEach(el => {
                el.classList.remove('highlight-error');
              });
              errorMsg.style.display = 'none';
              
              questions.forEach(q => {
                const answered = !!document.querySelector(`input[name="${q}"]:checked`);
                if (!answered) {
                  // Find the container (handling lack of :has support in some browsers)
                  let container;
                  if (CSS.supports('selector(:has(*))')) {
                    container = document.querySelector(`.question-container:has(input[name="${q}"])`);
                  } else {
                    // Manual fallback
                    const inputs = document.querySelectorAll(`input[name="${q}"]`);
                    if (inputs.length > 0) {
                      container = window.findParentQuestion(inputs[0]);
                    }
                  }
                  
                  if (container) container.classList.add('highlight-error');
                  hasError = true;
                }
              });
              
              if (hasError) {
                e.stopPropagation();
                errorMsg.style.display = 'block';
                errorMsg.scrollIntoView({ behavior: 'smooth', block: 'start' });
                return false;
              }

          },
          on_finish: function(data) {

const experienceTrial = {

        </div>

          <label for="somewhat_unpleasant">Somewhat unpleasant, but didn't mind going on</label>
        </div>
        <div class="multi-select-option">
          <input type="radio" id="unpleasant" name="emotional_experience" value="Unpleasant, wanted it to stop">

        </div>

        <p><strong>How did your normal state of consciousness change during the experience? * </strong>(Choose all that apply)</p>

          <input type="checkbox" id="no_change" name="consciousness_change" value="No change, fully alert in the here and now">

        <div class="multi-select-option">
          <input type="checkbox" id="relaxed" name="consciousness_change" value="Became relaxed or sleepy">
          <label for="relaxed">Became relaxed or sleepy</label>
        </div>
        <div class="multi-select-option">
          <input type="checkbox" id="dreamlike" name="consciousness_change" value="As if in a dreamlike state">
          <label for="dreamlike">As if in a dreamlike state</label>
        </div>
        <div class="multi-select-option">
          <input type="checkbox" id="transported" name="consciousness_change" value="Felt transported to another place">
          <label for="transported">Felt transported to another place</label>
        </div>
        <div class="multi-select-option">
          <input type="checkbox" id="lost_time" name="consciousness_change" value="Lost a sense of time">

      <div class="survey-question" style="margin-top: 30px;">
        <p><strong>If you felt a change in your state of consciousness, please describe how you felt in more detail: *</strong></p>

      </div>

  `,

    const formDiv = document.querySelector('.survey-questions');

    const errorDiv = document.createElement('div');
    errorDiv.className = 'error-message';
    errorDiv.id = 'form-error-message';
    errorDiv.textContent = "Please complete all required fields before continuing.";
    formDiv.insertBefore(errorDiv, formDiv.firstChild);
    
    // Ensure form validation happens before allowing to continue

    button.addEventListener('click', function(e) {
      let hasError = false;
      
      // Clear previous errors
      const errorMessage = document.getElementById('form-error-message');
      if (errorMessage) errorMessage.style.display = 'none';
      
      document.querySelectorAll('.highlight-error').forEach(el => {
        el.classList.remove('highlight-error');
      });
      
      // Check emotional experience
      const emotionalSection = document.querySelector('.survey-question:nth-child(1)');
      const emotional_experience = document.querySelector('input[name="emotional_experience"]:checked');
      if (!emotional_experience && emotionalSection) {
        emotionalSection.classList.add('highlight-error');
        hasError = true;
      }
      
      // Check consciousness change checkboxes
      const consciousnessSection = document.querySelector('.survey-question:nth-child(2)');
      const consciousness_checkboxes = document.querySelectorAll('input[name="consciousness_change"]:checked');
      if (consciousness_checkboxes.length === 0 && consciousnessSection) {
        consciousnessSection.classList.add('highlight-error');
        hasError = true;
      }
      
      // Check description
      const consciousness_description = document.getElementById('consciousness_description');
      if (consciousness_description && consciousness_description.value.trim() === '') {
        consciousness_description.classList.add('highlight-error');
        hasError = true;
      }
      
      if (hasError && errorMessage) {
        e.stopPropagation();
        e.preventDefault();
        errorMessage.style.display = 'block';
        // Scroll to error message
        errorMessage.scrollIntoView({ behavior: 'smooth', block: 'center' });
        return false;
      }
    }, true);
  },
  on_finish: function(data) {
    try {
      // Process form data
      const emotional_experience = document.querySelector('input[name="emotional_experience"]:checked');
      
      // Process checkbox data for consciousness change
      const checkboxes = document.querySelectorAll('input[name="consciousness_change"]:checked');
      const consciousness_changes = Array.from(checkboxes).map(cb => cb.value);
      
      // Get consciousness description
      const consciousness_description = document.getElementById('consciousness_description');
      
      // Set properties individually
      data.emotional_experience = emotional_experience ? emotional_experience.value : "NA";
      data.consciousness_changes = consciousness_changes;
      data.consciousness_description = consciousness_description ? consciousness_description.value : "NA";
      
      // Add a marker property to easily identify this trial
      data.is_experience_data = true;

};
    timeline.push(experienceTrial);

    const likertTrial = {

  </script>
